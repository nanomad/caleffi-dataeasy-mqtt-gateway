version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    ignore:
      # Skip odd-numbered (non-LTS) node releases; even majors still get PRs
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x", "31.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
