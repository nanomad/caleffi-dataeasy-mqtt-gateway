name: 'build stable images'

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build-images:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-images.yml
    with:
      image-tag: latest
      version-tag: ${{ github.ref_name }}
      use-cache: false
    secrets: inherit
