---
name: Build Docker images

on:
  workflow_call:
    inputs:
      image-tag:
        description: 'Primary moving tag (e.g. latest, dev)'
        required: true
        type: string
      version-tag:
        description: 'Version tag (e.g. 1.2.3, 1.2.3-rc1)'
        required: true
        type: string
      use-cache:
        description: 'Use the GitHub Actions build cache'
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_PASSWORD:
        required: false
      DOCKERHUB_ORGANIZATION:
        required: false

env:
  IMAGE_NAME: caleffi-dataeasy-mqtt-gateway

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners: no QEMU emulation
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set platform slug and lowercase repository
        id: vars
        run: |
          echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (per platform)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # Per-platform attestation manifests can't be merged; the merged
          # manifest is attested in the merge job instead.
          provenance: false
          sbom: false
          cache-from: ${{ inputs.use-cache && format('type=gha,scope={0}', steps.vars.outputs.slug) || '' }}
          cache-to: ${{ inputs.use-cache && format('type=gha,mode=max,scope={0}', steps.vars.outputs.slug) || '' }}
          tags: ghcr.io/${{ steps.vars.outputs.repo }}/${{ env.IMAGE_NAME }}:${{ inputs.image-tag }}-${{ steps.vars.outputs.slug }}

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_ORGANIZATION: ${{ secrets.DOCKERHUB_ORGANIZATION == null && secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_ORGANIZATION }}
    steps:
      - name: Set lowercase repository
        id: vars
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != null
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create multi-arch manifests
        id: manifest
        run: |
          GHCR="ghcr.io/${{ steps.vars.outputs.repo }}/${{ env.IMAGE_NAME }}"
          SOURCES=("${GHCR}:${{ inputs.image-tag }}-linux-amd64" "${GHCR}:${{ inputs.image-tag }}-linux-arm64")
          for tag in "${{ inputs.image-tag }}" "${{ inputs.version-tag }}"; do
            docker buildx imagetools create -t "${GHCR}:${tag}" "${SOURCES[@]}"
          done
          if [ -n "${DOCKERHUB_ORGANIZATION}" ]; then
            DH="${DOCKERHUB_ORGANIZATION}/${{ env.IMAGE_NAME }}"
            for tag in "${{ inputs.image-tag }}" "${{ inputs.version-tag }}"; do
              docker buildx imagetools create -t "${DH}:${tag}" "${SOURCES[@]}"
            done
          fi
          digest=$(docker buildx imagetools inspect "${GHCR}:${{ inputs.version-tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ghcr=${GHCR}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.manifest.outputs.ghcr }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
